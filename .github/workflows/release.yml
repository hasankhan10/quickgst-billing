name: Build & Release QuickGST Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package Release ZIP
        run: node scripts/build-release-zip.mjs

      - name: Build Windows Setup .EXE
        run: node scripts/build-installer.mjs --skip-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: QuickGST Billing ${{ github.ref_name }} (Built by Stova Media)
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-build/QuickGST-Billing-Windows-Setup.exe*
            release-build/QuickGST-Billing.zip
            release-build/QuickGST-Billing/QuickGST.exe
